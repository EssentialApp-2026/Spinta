<script>

const CFG = {"nome": "Chi scende la munnezza", "tipo": "sorteggio", "slogan": "Quando non si decide, decide la sorte. Un regalo di Gennarino.", "chiave": "chi-scende-v1", "opzioni": {"liste": [{"nome": "Chi scende la munnezza", "voci": ["Mamma", "Papà", "Ciro", "Sofia"]}, {"nome": "Chi lava i piatti", "voci": ["Mamma", "Papà", "Ciro", "Sofia"]}, {"nome": "Stasera si mangia", "voci": ["Pizza", "Panino", "Pasta e patate", "Frittata"]}], "gira": "Gira la ruota!", "risultato": "Tocca a: {x}!"}, "piede": "Gratis, senza registrazione e senza pubblicità. Tutto resta solo sul tuo telefono e funziona anche senza internet."};
const O = CFG.opzioni || {};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

}
const CHIAVE = CFG.chiave || ("regalo-" + (CFG.tipo || "app") + "-v1");
function leggi(def){ try { const v = JSON.parse(localStorage.getItem(CHIAVE) || "null"); return v && typeof v === "object" ? Object.assign(structuredClone(def), v) : structuredClone(def); } catch (_) { return structuredClone(def); } }
let avvisoMemoria = false;
function salva(stato){ try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (_) { if (!avvisoMemoria){ avvisoMemoria = true; alertaMsg("Non riesco a salvare: la memoria del browser è bloccata."); } } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const oggi = () => iso(new Date());
const piuGiorni = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const tra = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const dataIt = s => { if (!s) return ""; const [a, m, g] = s.split("-"); return g + "/" + m + "/" + a; };
const GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
const giornoDi = s => GIORNI[new Date(s + "T12:00:00").getDay()];
const fra = n => n === 0 ? "oggi" : n === 1 ? "domani" : n === -1 ? "ieri" : n > 1 ? "fra " + n + " giorni" : n + " giorni fa";
let msgEl = null;
function msg(t, err){ if (!msgEl) return; msgEl.className = err ? "err" : "msg"; msgEl.textContent = t || ""; if (t) clearTimeout(msg.t), msg.t = setTimeout(() => { if (msgEl.textContent === t) msgEl.textContent = ""; }, 4000); }

function scheda(titolo, ...figli){ return el("section", { class: "scheda", "aria-label": titolo }, titolo ? el("h2", { text: titolo }) : null, ...figli); }
async function copia(t){ try { await navigator.clipboard.writeText(t); msg("Copiato."); } catch (_) { msg("Non riesco a copiare da qui.", true); } }
function whatsapp(t){ window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank", "noopener"); }
async function condividi(t){ if (navigator.share){ try { await navigator.share({ text: t }); return; } catch (e) { if (e && e.name === "AbortError") return; } } whatsapp(t); }

/* ---------- promemoria nel calendario del telefono (.ics): suonano anche con l'app chiusa ---------- */
function icsData(s, hhmm){ const [h, m] = (hhmm || "09:00").split(":"); return s.replace(/-/g, "") + "T" + pad(+h) + pad(+m) + "00"; }

    L.push("BEGIN:VEVENT", "UID:" + uid() + "@gennarino", "DTSTAMP:" + ora, "DTSTART:" + icsData(e.data, e.ora), "DURATION:PT15M", "SUMMARY:" + icsTesto(e.titolo));

    if (e.ripeti) L.push("RRULE:" + e.ripeti);
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsTesto(e.titolo), "TRIGGER:-PT" + Math.max(0, e.prima || 0) + "M", "END:VALARM", "END:VEVENT");

/* ---------- suono e vibrazione ---------- */
let ac = null;
function bip(volte, freq){
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume();
    for (let i = 0; i < (volte || 3); i++){ const o = ac.createOscillator(), g = ac.createGain(); o.type = "square"; o.frequency.value = freq || 880;

  } catch (_) {}
  try { navigator.vibrate && navigator.vibrate([250, 120, 250, 120, 400]); } catch (_) {}
}
async function notifica(t){
  try { if (!("Notification" in window) || Notification.permission !== "granted") return;
    const r = await navigator.serviceWorker?.getRegistration(); if (r) r.showNotification(CFG.nome, { body: t, icon: "icona-192.png", vibrate: [250, 120, 250] }); else new Notification(CFG.nome, { body: t });

}
let lock = null;

/* =================== I MODELLI =================== */
const MODELLI = {};

/* ---- scadenze: cose con una data (frigo, documenti, garanzie, bollette) ---- */
MODELLI.scadenze = function(root){
  const S = leggi({ voci: [] }), avviso = O.avviso ?? 2;
  const cosa = el("input", { type: "text", id: "cosa", maxlength: 80, placeholder: O.placeholder || "Cosa", list: "sugg" });
  const quando = el("input", { type: "date", id: "quando", value: piuGiorni(oggi(), O.giorniBase || 3) });
  const sugg = el("datalist", { id: "sugg" }, (O.suggerimenti || []).map(s => el("option", { value: s })));
  const err = el("div", { class: "err", role: "alert" });
  const rapidi = el("div", { class: "chips", "aria-label": "Fra quanti giorni" }, (O.rapidi || [1, 3, 7, 30]).map(n =>
    el("button", { type: "button", text: n === 1 ? "domani" : "fra " + n + (O.unita === "mesi" ? " mesi" : " giorni"), on: { click: () => { quando.value = O.unita === "mesi" ? (() => { const d = new Date(); d.setMonth(d.getMonth() + n); return iso(d); })() : piuGiorni(oggi(), n); } } })));

    el("button", { type: "button", class: "x", text: k, on: { click: () => { cosa.value = k; quando.value = piuGiorni(oggi(), n); } } })));
  const form = el("form", { class: "campi", autocomplete: "off", novalidate: true, on: { submit: e => {
    e.preventDefault(); const c = cosa.value.trim(); if (!c){ err.textContent = O.erroreVuoto || "Scrivi cosa."; return; }
    if (!quando.value){ err.textContent = "Scegli la data."; return; }
    err.textContent = ""; S.voci.push({ id: uid(), cosa: c, quando: quando.value, dal: oggi(), fatto: "" }); salva(S);
    cosa.value = ""; quando.value = piuGiorni(oggi(), O.giorniBase || 3); msg(O.scritto || "Segnato."); disegna(); } } },
    el("label", {}, O.etichetta || "Cosa", cosa), sugg, esempi.children.length ? el("div", { class: "nota", text: O.notaEsempi || "Tocca un esempio e la data si mette da sola:" }) : null, esempi.children.length ? esempi : null,
    el("label", {}, O.etichettaData || "Scade il", quando), rapidi, err, el("button", { type: "submit", class: "grande", text: O.bottone || "Segna" }));
  let filtro = "aperti", conferma = null;
  const filtri = el("div", { class: "chips" }, [["aperti", O.filtroAperti || "Da tenere d'occhio"], ["chiusi", O.filtroChiusi || "Fatti"]].map(([f, t]) =>
    el("button", { type: "button", "aria-pressed": f === filtro, text: t, on: { click: e => { filtro = f; [...filtri.children].forEach(b => b.setAttribute("aria-pressed", b === e.currentTarget)); disegna(); } } })));

  const azioni = el("div", { class: "due" },
    el("button", { type: "button", class: "piccolo", text: "Manda la lista", on: { click: () => {
      const a = S.voci.filter(v => !v.fatto).sort((x, y) => x.quando.localeCompare(y.quando));
      condividi(a.length ? (CFG.nome + "\n" + a.map(v => "- " + v.cosa + ": " + (O.parola || "scade") + " " + fra(tra(oggi(), v.quando)) + " (" + dataIt(v.quando) + ")").join("\n")) : CFG.nome + ": niente in scadenza.");

      return el("div", { class: "voce verde" }, el("div", { class: "r1" }, el("b", { text: (v.emoji ? v.emoji + " " : "") + v.nome }), el("span", { class: "nota", text: v.obiettivo ? "obiettivo " + v.obiettivo : "" })),
        el("div", { class: "regola" }, el("button", { type: "button", text: "−", "aria-label": "Meno", on: { click: () => cambia(v.nome, -1) } }), el("b", { class: "grosso", text: c }), el("button", { type: "button", text: "+", "aria-label": "Più", on: { click: () => cambia(v.nome, 1) } })),
        el("div", { class: "barre", "aria-label": "Ultimi sette giorni" }, sett.map(x => el("span", { style: "height:" + Math.round(4 + 40 * x / mx) + "px", title: x }))), el("div", { class: "nota", text: "ultimi sette giorni" }));
    }));
  }
  disegna();
};
