# Prova della voce «Mako» rifatta gratis (Chatterbox Multilingual, MIT) dalle battute Mako originali: salva le prove in claude/voci/prove/.
name: Prova voce Mako
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automatico/prova-voce.txt']
permissions:
  contents: write
concurrency:
  group: spinta-voce
  cancel-in-progress: false
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Programmi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 soundfile
      - name: Prova
        shell: bash
        run: |
          set -o pipefail
          mkdir -p claude/voci/prove
          python3 automatico/voce_mako.py prova 2>&1 | grep -v "Warn\|warn" | tee claude/voci/prove/log.txt
      - name: Salva
        if: always()
        shell: bash
        run: |
          git config user.name "Spinta automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude/voci/prove
          git commit -q -m "Prova voce Mako gratis ($(date -u +%F))" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i * 7)); done
          exit 1
