# Prova del modello AI locale (gratis): scrive due idee di prova e le salva in automatico/prova-ai-uscita.json.
name: Prova del modello AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automatico/prova-ai.txt']
permissions:
  contents: write
concurrency:
  group: spinta-automatico
  cancel-in-progress: false
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPINTA_MODELLI: /home/runner/.cache/spinta-modelli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Modelli (dalla cache)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/spinta-modelli
          key: spinta-modelli-ai-v1
      - name: Prova
        shell: bash
        run: |
          set -o pipefail
          python3 automatico/ai.py prova 2 2>&1 | grep -v device_discovery | tee automatico/prova-ai-uscita.txt
      - name: Salva
        if: always()
        run: |
          git config user.name "Spinta automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automatico/prova-ai-uscita.txt
          git commit -q -m "Prova del modello AI" || exit 0
          git pull -q --rebase
          git push -q
