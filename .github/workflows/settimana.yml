# Spinta prepara da sola la settimana dopo, gratis: idee, piazza e panoramica, piano, voci di Gennarino, app regalo e banco della serie.
# Gira ogni sabato pomeriggio; si può lanciare anche a mano da GitHub (Actions → «Settimana di Spinta» → Run workflow).
name: Settimana di Spinta
on:
  schedule:
    - cron: '30 15 * * 6'          # sabato 15:30 UTC (16:30 o 17:30 in Italia)
  workflow_dispatch:
    inputs:
      settimana:
        description: 'Settimana da preparare (es. 2026-W46; anche più di una, separate da spazi). Vuoto = la prossima'
        required: false
        default: ''
      solo_piazza:
        description: 'si = rifà solo la panoramica della domenica delle settimane indicate (stessa piazza)'
        required: false
        default: 'no'
  push:
    branches: [main]
    paths: ['automatico/prova-settimana.txt']
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: spinta-automatico
  cancel-in-progress: false
jobs:
  prepara:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SPINTA_MODELLI: /home/runner/.cache/spinta-modelli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Programmi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-dejavu-core > /dev/null
      - name: Modelli (dalla cache)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/spinta-modelli
          key: spinta-modelli-v2
      - name: Pacchetti Python
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro-onnx piper-tts sherpa-onnx soundfile librosa numpy pillow onnxruntime
      - name: Prepara la settimana
        shell: bash
        run: |
          set -o pipefail
          opz=""; [ "${{ github.event.inputs.solo_piazza }}" = "si" ] && opz="--rifai-piazza"
          sett="${{ github.event.inputs.settimana }}"
          : > automatico/ultimo-lavoro.txt
          for w in ${sett:-prossima}; do
            [ "$w" = "prossima" ] && w=""
            python3 automatico/settimana.py $w $opz 2>&1 | grep -v device_discovery | tee -a automatico/ultimo-lavoro.txt
          done
      - name: Pubblica
        run: |
          git config user.name "Spinta automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A claude libreria regali automatico
          git commit -q -m "Spinta in automatico: settimana preparata ($(date -u +%F))" || exit 0
          git pull -q --rebase
          git push -q
      - name: Aggiorna il sito
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds > /dev/null || true
      - name: Avvisa se qualcosa è andato storto
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="Spinta: la settimana nuova non si è preparata da sola"
          gh issue list --repo ${{ github.repository }} --state open --json title --jq '.[].title' | grep -Fxq "$t" && exit 0
          gh issue create --repo ${{ github.repository }} --title "$t" --body "Il lavoro automatico non è finito: guarda il log qui ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} e rilancialo da Actions → Run workflow." || true
