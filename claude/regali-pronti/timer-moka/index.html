<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a33">
<title>Timer p' 'a moka</title>
<meta name="description" content="Il timer per la moka: ti avvisa quando sale il caffè e quando gorgoglia, e impara i tempi della tua. Un regalo di Gennarino, gratis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Il timer è la moka stessa: il caffè sale nella parte di sopra mentre passa il tempo. Sotto, il fuoco del fornello scelto. */
:root{
  --notte:#171a33; --notte-2:#22264a; --linea:#363b6b;
  --crema:#fbf3e2; --pomodoro:#e63946; --led:#4ff0d0;
  --caffe:#5b3420; --cremina:#c98f55;
  --testo:#eef0ff; --tenue:#a9aed6;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--notte);color:var(--testo);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100dvh;display:flex;flex-direction:column}
.tenda{height:30px;flex:none;background:repeating-linear-gradient(90deg,var(--pomodoro) 0 40px,var(--crema) 40px 80px);position:relative}
.tenda::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:radial-gradient(circle at 20px 0,var(--pomodoro) 19px,transparent 20px) 0 0/80px 12px repeat-x,
             radial-gradient(circle at 60px 0,var(--crema) 19px,transparent 20px) 0 0/80px 12px repeat-x}
main{width:100%;max-width:480px;margin:0 auto;padding:30px 16px 24px;flex:1;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,8vw,2.2rem);line-height:1.05;margin:0;color:var(--crema)}
.da{margin:4px 0 0;color:var(--tenue);font-size:.95rem}
.da a{color:var(--tenue)}

.scena{display:grid;justify-items:center;gap:6px;margin-top:4px}
.scena svg{width:min(62vw,250px);height:auto;overflow:visible}
.tempo{font-family:var(--display);font-size:clamp(3.2rem,17vw,4.6rem);line-height:1;color:var(--crema);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.fase{min-height:3em;text-align:center;font-size:1.05rem;max-width:32ch;margin:0}
.fase b{color:var(--led)}

.scelte{display:grid;gap:14px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{padding:0;margin-bottom:8px;font-weight:600;color:var(--tenue);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--linea);background:var(--notte-2);color:var(--testo);
  font:600 1rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--crema);border-color:var(--crema);color:#231a14}
.stima{margin:0;color:var(--tenue);font-size:.98rem}
.stima b{color:var(--testo)}

.azioni{display:grid;gap:10px;margin-top:auto;padding-top:8px}
.btn{min-height:56px;border-radius:16px;border:0;font:800 1.08rem var(--body);cursor:pointer;padding:0 18px;
  background:var(--pomodoro);color:var(--crema)}
.btn.chiaro{background:var(--crema);color:#231a14}
.btn.vuoto{background:transparent;color:var(--testo);border:2px solid var(--linea);min-height:48px;font-weight:600}
.btn:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.riga2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.allarme .btn:first-child{animation:batte 0.9s ease-in-out infinite}
@keyframes batte{50%{transform:scale(1.03)}}

.consiglio{margin:0;padding:12px 14px;border-left:4px solid var(--cremina);background:var(--notte-2);border-radius:0 12px 12px 0;color:var(--testo);font-size:.98rem}
footer{max-width:480px;margin:0 auto;padding:6px 16px 26px;color:var(--tenue);font-size:.85rem;text-align:center}
footer a{color:var(--tenue)}

/* fuoco sotto la moka */
#moka:not(.acceso) .fuoco{opacity:.35}
.fiamma{transform-box:fill-box;transform-origin:50% 100%}
.acceso .fiamma{animation:guizzo .5s ease-in-out infinite alternate}
.acceso .fiamma:nth-child(2n){animation-duration:.42s}
.acceso .fiamma:nth-child(3n){animation-duration:.58s}
@keyframes guizzo{from{transform:scaleY(.82)}to{transform:scaleY(1.08)}}
.vapore path{opacity:0}
.fuma .vapore path{animation:fumo 1.8s ease-out infinite}
.fuma .vapore path:nth-child(2){animation-delay:.6s}
.fuma .vapore path:nth-child(3){animation-delay:1.2s}
@keyframes fumo{0%{opacity:0;transform:translateY(6px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="tenda" aria-hidden="true"></div>
<main>
  <header>
    <h1>Timer p' 'a moka</h1>
    <p class="da">Un regalo di Gennarino da <a href="https://essentialapp-2026.github.io/bancariello/">'O Bancariello</a></p>
  </header>

  <div class="scena">
    <svg id="moka" viewBox="0 0 200 250" role="img" aria-label="La moka sul fuoco">
      <defs>
        <linearGradient id="allu" x1="0" x2="1">
          <stop offset="0" stop-color="#8d93a8"/><stop offset=".22" stop-color="#d9dde8"/><stop offset=".4" stop-color="#f4f6fb"/>
          <stop offset=".62" stop-color="#bcc2d2"/><stop offset="1" stop-color="#6f7590"/>
        </linearGradient>
        <clipPath id="sopra"><polygon points="56,42 144,42 131,112 69,112"/></clipPath>
      </defs>
      <!-- vapore che esce dal becco -->
      <g class="vapore" fill="none" stroke="#dfe3f2" stroke-width="3" stroke-linecap="round">
        <path d="M30 26 q-6 -8 0 -16 q6 -8 0 -16"/>
        <path d="M40 22 q-6 -8 0 -16 q6 -8 0 -16"/>
        <path d="M22 30 q-6 -8 0 -16 q6 -8 0 -16"/>
      </g>
      <!-- manico -->
      <path d="M141 50 C172 50 178 58 176 70 L170 104 C169 110 165 112 158 112 L132 112" fill="none" stroke="#1d1d24" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- pomello e coperchio -->
      <rect x="90" y="16" width="20" height="12" rx="4" fill="#1d1d24"/>
      <polygon points="62,30 138,30 146,42 54,42" fill="url(#allu)"/>
      <!-- parte di sopra con il becco -->
      <polygon points="56,42 144,42 131,112 69,112" fill="url(#allu)"/>
      <polygon points="56,42 30,38 38,50 60,58" fill="url(#allu)"/>
      <!-- il caffè che sale -->
      <g clip-path="url(#sopra)">
        <rect id="caffe" x="50" y="112" width="100" height="80" fill="#5b3420" opacity=".93"/>
        <rect id="crema-top" x="50" y="112" width="100" height="5" fill="#c98f55"/>
      </g>
      <g stroke="#7d8399" stroke-width="1.2" opacity=".55">
        <line x1="85" y1="42" x2="88" y2="112"/><line x1="115" y1="42" x2="112" y2="112"/>
      </g>
      <!-- giunto -->
      <rect x="66" y="112" width="68" height="12" fill="#9aa0b4"/>
      <!-- caldaia -->
      <polygon points="68,124 132,124 149,206 51,206" fill="url(#allu)"/>
      <g stroke="#7d8399" stroke-width="1.2" opacity=".55">
        <line x1="88" y1="124" x2="83" y2="206"/><line x1="112" y1="124" x2="117" y2="206"/>
      </g>
      <circle cx="140" cy="168" r="4" fill="#9aa0b4"/>
      <!-- fornello -->
      <g id="gas" class="fuoco">
        <rect x="40" y="226" width="120" height="8" rx="4" fill="#3b3f5c"/>
        <g fill="#5aa9ff">
          <path class="fiamma" d="M56 226 q-5 -10 0 -18 q5 8 0 18z"/>
          <path class="fiamma" d="M78 226 q-5 -12 0 -21 q5 9 0 21z"/>
          <path class="fiamma" d="M100 226 q-5 -13 0 -23 q5 10 0 23z"/>
          <path class="fiamma" d="M122 226 q-5 -12 0 -21 q5 9 0 21z"/>
          <path class="fiamma" d="M144 226 q-5 -10 0 -18 q5 8 0 18z"/>
        </g>
      </g>
      <g id="induzione" class="fuoco" hidden>
        <rect x="26" y="212" width="148" height="18" rx="6" fill="#20233c"/>
        <ellipse class="anello" cx="100" cy="214" rx="52" ry="5" fill="none" stroke="#ff5c5c" stroke-width="3"/>
      </g>
      <g id="elettrico" class="fuoco" hidden>
        <rect x="26" y="212" width="148" height="18" rx="6" fill="#20233c"/>
        <ellipse class="anello" cx="100" cy="214" rx="50" ry="5" fill="none" stroke="#ff8a3d" stroke-width="3"/>
        <ellipse class="anello" cx="100" cy="214" rx="34" ry="3.4" fill="none" stroke="#ff8a3d" stroke-width="3"/>
      </g>
    </svg>
    <div class="tempo" id="tempo" aria-live="off">3:50</div>
    <p class="fase" id="fase" aria-live="polite">Scegli la tua moka e il fornello.</p>
  </div>

  <!-- prima di partire -->
  <section class="scelte" id="scelte" aria-label="La tua moka">
    <fieldset><legend>Quante tazze fa la moka</legend><div class="chips" id="tazze"></div></fieldset>
    <fieldset><legend>Fornello</legend><div class="chips" id="fornello"></div></fieldset>
    <fieldset><legend>Acqua nella caldaia</legend><div class="chips" id="acqua"></div></fieldset>
    <p class="stima" id="stima"></p>
  </section>

  <p class="consiglio" id="consiglio"></p>

  <div class="azioni" id="az-pronto">
    <button class="btn" id="avvia">Accendi il fuoco e avvia</button>
  </div>
  <div class="azioni" id="az-corsa" hidden>
    <div class="riga2">
      <button class="btn chiaro" id="sale">Sale adesso</button>
      <button class="btn chiaro" id="gorgoglia">Gorgoglia già</button>
    </div>
    <button class="btn vuoto" id="annulla">Annulla</button>
  </div>
  <div class="azioni allarme" id="az-allarme" hidden>
    <button class="btn" id="tolta">L'ho tolta dal fuoco</button>
    <button class="btn vuoto" id="ancora">Non gorgoglia ancora (+20 secondi)</button>
  </div>
  <div class="azioni" id="az-fatto" hidden>
    <button class="btn" id="altro">Un altro caffè</button>
  </div>
</main>
<footer>Gratis, senza registrazione e senza pubblicità: i tempi della tua moka restano sul tuo telefono.<br>
  <a href="https://essentialapp-2026.github.io/bancariello/">'O Bancariello</a> · <a href="https://www.tiktok.com/@bancariello.gennarino" target="_blank" rel="noopener">Gennarino su TikTok</a></footer>

<script>
const $ = id => document.getElementById(id);
const leggi = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

// secondi dal fuoco acceso a quando sale il caffè (fornello a gas, acqua fredda, fiamma bassa) e quanto dura la salita
const BASE = { 1: [160, 35], 2: [190, 40], 3: [230, 50], 4: [255, 55], 6: [300, 65], 9: [380, 80], 12: [450, 95] };
const FORNELLI = { gas: ["Gas", 1], induzione: ["Induzione", 0.72], elettrico: ["Elettrico", 1.35] };
const ACQUE = { fredda: ["Fredda", 1], calda: ["Già calda", 0.5] };
const CONSIGLI = [
  "Acqua fino alla valvola, mai sopra.",
  "Il caffè nel filtro senza pressarlo: deve respirare.",
  "Fiamma bassa: chiù lenta, chiù bbona.",
  "Tieni il coperchio aperto, così vedi quando sale.",
  "Appena gorgoglia toglila dal fuoco, se no sape 'e bruciato.",
  "Con l'acqua già calda nella caldaia il caffè esce prima. Occhio al manico, che scotta.",
];

const st = Object.assign({ tazze: 3, fornello: "gas", acqua: "fredda" }, leggi("moka-scelte", {}));
const impara = leggi("moka-impara", {});   // fattore per fornello e acqua: quanto è più lenta o più veloce la tua moka

function chiave() { return st.fornello + "|" + st.acqua; }
function fattore() { const x = impara[chiave()]; return x && x.f ? x.f : 1; }
// tempi stimati in secondi: [sale, gorgoglia]
function tempi() {
  const [t1, d] = BASE[st.tazze], kf = FORNELLI[st.fornello][1], ka = ACQUE[st.acqua][1], f = fattore();
  const sale = t1 * kf * ka * f, durata = d * Math.sqrt(kf) * Math.sqrt(f);
  return [sale, sale + durata];
}
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function chips(id, voci, campo) {
  $(id).innerHTML = voci.map(([v, nome]) => `<button class="chip" type="button" data-v="${v}" aria-pressed="${String(st[campo]) === String(v)}">${nome}</button>`).join("");
  $(id).onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    st[campo] = campo === "tazze" ? +b.dataset.v : b.dataset.v; scrivi("moka-scelte", st); disegnaScelte();
  };
}
function disegnaScelte() {
  chips("tazze", Object.keys(BASE).map(n => [n, n]), "tazze");
  chips("fornello", Object.entries(FORNELLI).map(([k, v]) => [k, v[0]]), "fornello");
  chips("acqua", Object.entries(ACQUE).map(([k, v]) => [k, v[0]]), "acqua");
  const [a, b] = tempi(), n = (impara[chiave()] || {}).n || 0;
  $("tempo").textContent = mmss(b);
  $("stima").innerHTML = `Il caffè sale dopo circa <b>${mmss(a)}</b> e gorgoglia verso <b>${mmss(b)}</b>.` +
    (n ? ` Tempi presi dalla tua moka (${n} caffè finora).` : " Tocca «Sale adesso» quando lo vedi salire: la prossima volta il tempo è quello della tua moka.");
  fuoco();
}
function fuoco() {
  ["gas", "induzione", "elettrico"].forEach(k => $(k).toggleAttribute("hidden", k !== st.fornello));   // sono elementi SVG: serve l'attributo
}

/* ---- suoni: programmati in anticipo sull'orologio dell'audio, così suonano in tempo anche se il telefono rallenta la pagina ---- */
let ac = null, bus = null;
function audioPronto() {
  try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (_) { ac = null; }
}
function nota(dest, f, t, dur, vol, tipo) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function programma(fraSale, fraGorgoglio) {
  if (!ac) return;
  if (bus) { try { bus.disconnect(); } catch (_) {} }
  bus = ac.createGain(); bus.gain.value = 1; bus.connect(ac.destination);
  const t0 = ac.currentTime;
  if (fraSale > 0.3) { nota(bus, 784, t0 + fraSale, 0.6, 0.25); nota(bus, 1046.5, t0 + fraSale + 0.16, 0.8, 0.25); }
  for (let i = 0; i < 70; i++) { const t = t0 + Math.max(0.05, fraGorgoglio) + i * 0.65; nota(bus, i % 2 ? 660 : 880, t, 0.22, 0.5, "square"); }
}
function zitto() { if (bus) { try { bus.disconnect(); } catch (_) {} bus = null; } }

/* ---- schermo acceso mentre il caffè sale ---- */
let lock = null;
async function schermo(on) {
  try {
    if (on && "wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (_) { lock = null; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && corsa) schermo(true); });

/* ---- la corsa ---- */
let corsa = null;   // { t0, sale, gorg, saleVero, allarme }
function mostra(stato) {
  $("scelte").hidden = stato !== "pronto";
  $("az-pronto").hidden = stato !== "pronto";
  $("az-corsa").hidden = stato !== "corsa";
  $("az-allarme").hidden = stato !== "allarme";
  $("az-fatto").hidden = stato !== "fatto";
  $("moka").classList.toggle("acceso", stato === "corsa" || stato === "allarme");
}
function livello(p) {   // 0 vuota, 1 piena
  const y = 112 - 66 * Math.max(0, Math.min(1, p));
  $("caffe").setAttribute("y", y); $("crema-top").setAttribute("y", y);
}
function avvia() {
  audioPronto();
  const [a, b] = tempi();
  corsa = { t0: performance.now(), sale: a, gorg: b, saleVero: null, allarme: false };
  programma(a, b); schermo(true); mostra("corsa"); $("sale").disabled = false; window.scrollTo(0, 0);
  $("moka").classList.remove("fuma"); giro();
}
function adesso() { return (performance.now() - corsa.t0) / 1000; }
function giro() {
  if (!corsa) return;
  const t = adesso(), salito = corsa.saleVero != null || t >= corsa.sale;
  $("tempo").textContent = mmss(corsa.gorg - t);
  const inizio = corsa.saleVero ?? corsa.sale;
  livello(t < inizio ? 0 : (t - inizio) / Math.max(1, corsa.gorg - inizio));
  if (!corsa.allarme && t >= corsa.gorg) { corsa.allarme = true; suona(); }
  if (!corsa.allarme) {
    $("fase").innerHTML = corsa.saleVero != null
      ? "<b>Sale il caffè.</b> Se fai la cremina, prendi adesso le prime gocce."
      : salito ? "<b>Tra poco sale:</b> guarda nella moka e tocca «Sale adesso» quando lo vedi."
      : "L'acqua si scalda. Tieni il coperchio aperto.";
  }
  requestAnimationFrame(giro);
}
function suona() {
  mostra("allarme"); $("moka").classList.add("fuma"); livello(1);
  $("fase").innerHTML = "<b>Gorgoglia: togli la moka dal fuoco!</b>";
  try { navigator.vibrate && navigator.vibrate([500, 200, 500, 200, 900]); } catch (_) {}
}
// impara dai tempi veri: la prossima volta la stima è quella della tua moka
function aggiorna(rapporto) {
  if (!(rapporto > 0.3 && rapporto < 3)) return;
  const k = chiave(), x = impara[k] || { f: 1, n: 0 };
  const nuovo = x.f * rapporto, peso = x.n ? 0.5 : 0.8;
  x.f = Math.min(2.5, Math.max(0.4, x.f * (1 - peso) + nuovo * peso)); x.n++;
  impara[k] = x; scrivi("moka-impara", impara);
}
$("avvia").onclick = avvia;
$("sale").onclick = () => {
  if (!corsa || corsa.saleVero != null) return;
  const t = adesso(); aggiorna(t / corsa.sale);
  const durata = corsa.gorg - corsa.sale;
  corsa.saleVero = t; corsa.gorg = t + durata; corsa.allarme = false;
  programma(-1, corsa.gorg - t); $("sale").disabled = true;
};
function finito(msg) {
  const t = corsa ? adesso() : 0; corsa = null; zitto(); schermo(false);
  mostra("fatto"); $("moka").classList.add("fuma"); livello(1);
  $("tempo").textContent = mmss(t);
  $("fase").innerHTML = msg;
}
$("gorgoglia").onclick = () => {
  if (!corsa) return;
  const t = adesso();
  if (corsa.saleVero == null) aggiorna(t / corsa.gorg);
  finito("<b>Buon caffè!</b> Pronto in " + mmss(t) + ". La prossima volta lo calcolo sulla tua moka.");
};
$("tolta").onclick = () => finito("<b>Buon caffè!</b> Bevilo caldo.");
$("ancora").onclick = () => {
  if (!corsa) return;
  const t = adesso(); corsa.gorg = t + 20; corsa.allarme = false;
  if (corsa.saleVero == null) aggiorna(1.08);
  programma(-1, 20); mostra("corsa"); $("moka").classList.remove("fuma");
};
$("annulla").onclick = () => { corsa = null; zitto(); schermo(false); mostra("pronto"); livello(0); disegnaScelte(); $("fase").textContent = "Scegli la tua moka e il fornello."; };
$("altro").onclick = () => { mostra("pronto"); livello(0); $("moka").classList.remove("fuma"); disegnaScelte(); $("fase").textContent = "Scegli la tua moka e il fornello."; nuovoConsiglio(); };

let ci = Math.floor(Math.random() * CONSIGLI.length);
function nuovoConsiglio() { ci = (ci + 1) % CONSIGLI.length; $("consiglio").textContent = CONSIGLI[ci]; }
nuovoConsiglio();
disegnaScelte(); mostra("pronto"); livello(0);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
